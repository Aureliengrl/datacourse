name: Parquet CAC 40 Bot Rebalance Cycle

on:
  # Déclenchement manuel
  workflow_dispatch:
  # Déclenchement automatique 1 fois par jour après la clôture des marchés à 17h50 Paris (15h50 UTC)
  # Ce rythme journalier évite le sur-trading et préserve le capital des frais de courtage excessifs
  schedule:
    - cron: '50 15 * * 1-5'

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Single Trading Cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ETUDIANT_EMAIL: ${{ secrets.ETUDIANT_EMAIL }}
          ETUDIANT_PASSWORD: ${{ secrets.ETUDIANT_PASSWORD }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          LOOKBACK_PERIOD: ${{ vars.LOOKBACK_PERIOD || '60' }}
          MAX_STOCK_WEIGHT: ${{ vars.MAX_STOCK_WEIGHT || '0.15' }}
          MAX_SECTOR_WEIGHT: ${{ vars.MAX_SECTOR_WEIGHT || '0.30' }}
          MIN_CASH_BUFFER: ${{ vars.MIN_CASH_BUFFER || '0.05' }}
          STOP_LOSS_THRESHOLD: ${{ vars.STOP_LOSS_THRESHOLD || '0.10' }}
          REBALANCE_THRESHOLD: ${{ vars.REBALANCE_THRESHOLD || '0.08' }}
          MIN_TRADE_AMOUNT: ${{ vars.MIN_TRADE_AMOUNT || '15000' }}
        run: |
          python -c "from parquet_bot import ParquetCAC40Bot; bot = ParquetCAC40Bot(); bot.run_strategy_cycle()"

      - name: Upload Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parquet-bot-log
          path: parquet_bot.log
          retention-days: 7
